<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>로그인 연결 중…</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
         background:#f7f7f8; color:#33363b; }
  .box { text-align:center; padding:32px 28px; }
  .msg { font-size:15px; letter-spacing:-0.01em; }
  .sub { margin-top:10px; font-size:13px; color:#8a8f98; }
  .err { color:#a13d3d; }
  code { background:#ececee; padding:2px 6px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<div class="box">
  <div class="msg" id="msg">로그인 연결 중…</div>
  <div class="sub" id="sub"></div>
</div>
<script>
/*
 * OAuth 중계 페이지 — project-dashboard
 *
 * 왜 필요한가: 대시보드는 cloudflared quick tunnel 로 외부에 노출되는데 그 주소가
 * 재기동마다 바뀐다. 구글 OAuth 는 리디렉션 주소를 사전 등록된 값과 정확히 대조하므로
 * 매번 콘솔에 새 주소를 등록해야 했다(자동화 수단 없음).
 *
 * 그래서 구글에는 이 페이지 주소 하나만 영구 등록하고, 이 페이지가 state 에 실려온
 * "현재 터널 주소" 로 인증 코드를 되돌려보낸다.
 *
 * state 형식: "<랜덤>.<base64url(origin)>"
 * 코드를 임의 도메인으로 흘리지 않도록 전달 대상은 아래 화이트리스트로 제한한다.
 */
var ALLOWED_ORIGIN = /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/;

function fail(text, detail) {
  document.getElementById('msg').innerHTML = '<span class="err">' + text + '</span>';
  document.getElementById('sub').innerHTML = detail || '';
}

(function () {
  var qs = location.search;
  if (!qs || qs.length < 2) {
    fail('잘못된 접근입니다.', '이 페이지는 구글 로그인 과정에서 자동으로 거쳐가는 중계 페이지입니다.');
    return;
  }

  var state = new URLSearchParams(qs).get('state') || '';
  var dot = state.indexOf('.');
  if (dot < 0) {
    fail('로그인 정보가 올바르지 않습니다.', '대시보드에서 다시 로그인해 주세요.');
    return;
  }

  var origin = '';
  try {
    var b64 = state.slice(dot + 1).replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    origin = atob(b64);
  } catch (e) {
    origin = '';
  }

  if (!ALLOWED_ORIGIN.test(origin)) {
    fail('허용되지 않은 대상입니다.',
         '전달 대상이 허용 목록에 없어 중단했습니다: <code>' +
         (origin ? origin.replace(/[<>&]/g, '') : '(해석 불가)') + '</code>');
    return;
  }

  document.getElementById('sub').textContent = origin.replace('https://', '') + ' 로 이동합니다…';
  location.replace(origin + '/auth/callback' + qs);
})();
</script>
</body>
</html>
