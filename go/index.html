<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>사업관리 대시보드</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
         background:#f0f2f5; color:#333a44; }
  .box { text-align:center; padding:32px 28px; }
  .msg { font-size:15px; letter-spacing:-0.01em; }
  .sub { margin-top:10px; font-size:13px; color:#646d7a; }
  .err { color:#cf2e2e; }
  a { color:#006fe0; }
</style>
</head>
<body>
<div class="box">
  <div class="msg" id="msg">대시보드로 이동 중…</div>
  <div class="sub" id="sub"></div>
</div>
<script>
/*
 * 고정 바로가기 — project-dashboard
 *
 * 대시보드는 cloudflared quick tunnel 로 노출돼 주소가 재기동마다 바뀐다.
 * 사람들은 이 페이지 주소만 기억하고, 여기서 current.json 에 적힌 "지금 터널 주소" 로 넘어간다.
 * current.json 은 터널을 켤 때 scripts/publish_tunnel_url.sh 가 갱신해 push 한다.
 *
 * 로그인 중계(../index.html)와 같은 화이트리스트로만 이동 — 오픈 리디렉트 방지.
 */
var ALLOWED_ORIGIN = /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/;

function fail(text, detail) {
  document.getElementById('msg').innerHTML = '<span class="err">' + text + '</span>';
  document.getElementById('sub').innerHTML = detail || '';
}

// GitHub Pages 는 10분 캐시를 걸어 두므로 매번 다른 쿼리로 받아 온다
fetch('../current.json?t=' + Date.now(), { cache: 'no-store' })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function (d) {
    var url = String((d && d.url) || '').replace(/\/+$/, '');
    if (!ALLOWED_ORIGIN.test(url)) {
      fail('등록된 주소가 올바르지 않습니다.', '관리자에게 문의해 주세요.');
      return;
    }
    document.getElementById('sub').textContent = url.replace('https://', '') + ' 로 이동합니다…';
    location.replace(url + '/');
  })
  .catch(function () {
    fail('현재 대시보드 주소를 불러오지 못했습니다.',
         '잠시 후 <a href="javascript:location.reload()">다시 시도</a>해 주세요.');
  });
</script>
</body>
</html>
